<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Framer Testimonial Section</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: black;
      color: white;
    }
  </style>
</head>

<body class="p-8">

  <section class="max-w-6xl mx-auto">

    <h2 class="text-4xl font-semibold mb-10 leading-tight">
      Powering ambitious<br>teams worldwide
    </h2>

    <!-- Main Card -->
    <div class="border-2 border-white/5 rounded-3xl overflow-hidden flex flex-col lg:flex-row">

      <!-- LEFT SIDE -->
      <div class="p-10 lg:w-1/2 flex flex-col justify-between">

        <div>
     

          <p class="text-2xl font-medium leading-relaxed">
            “Framer gives us everything<br>
            we need to move fast. We<br>
            don’t wait on dev. We don’t<br>
            compromise on design.”
          </p>
        </div>

        <div class="mt-10">
          <div class="flex items-center gap-3">
            <img src="https://i.pravatar.cc/60"
                 class="w-12 h-12 rounded-full">
            <div class="text-sm opacity-80">
              Henry Madsen<br>
              Head of Design at Perplexity
            </div>
          </div>

          <a href="#" class="text-sm mt-5 inline-block opacity-80 hover:opacity-100 transition">
            Read more ›
          </a>
        </div>
      </div>

      <!-- RIGHT SIDE (IMAGE) -->
      <div class="lg:w-1/2 relative">
        <img src="https://i.pinimg.com/736x/3e/24/27/3e2427a820c7cd0ff6ae1782b20c3b50.jpg"
             class="w-full h-full object-cover">
      </div>

    </div>

    <!-- Optional footer navigation like screenshot -->
    <div class="flex justify-center gap-8 text-neutral-500 mt-8 text-sm">
      <span>Perplexity</span>
      <span>Visual Electric</span>
      <span>Biograph</span>
      <span>Cradle</span>
      <span>Milc</span>
    </div>

  </section>

</body>
</html>
